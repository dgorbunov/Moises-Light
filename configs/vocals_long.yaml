musdb_root: "~/musdb18hq"
max_train_samples: 800
max_val_samples: 25
target_stem: "vocals"

sample_rate: 44100
segment_seconds: 7.0
train_overlap: 0.75
eval_overlap: 0.50

batch_size: 8
num_workers: 12
lr: 0.0002
lr_patience_epochs: 20
lr_factor: 0.9
early_stop_patience_epochs: 50
metrics_every_n_epochs: 10
debug: false
debug_num_tracks: 2
debug_epochs: 10

use_multires_loss: true
stft:
  n_fft: 6144
  hop_length: 1024
  win_length: 6144
  freq_bins: 2048
multires:
  fft_sizes: [1024, 2048, 4096]
  hop_sizes: [256, 512, 1024]
  win_lengths: [1024, 2048, 4096]

nband: 4
g: 56
nrope: 5
nsplit_enc: 3
nsplit_dec: 1
latent_dim: 128

trainer:
  accelerator: "gpu"
  devices: 1
  strategy: "auto"
  precision: "bf16-mixed"
  max_epochs: 300
  log_every_n_steps: 20
  deterministic: false

out_dir: "runs/moises_light"
